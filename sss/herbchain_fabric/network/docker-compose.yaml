# AyurTrace+ Fabric test network.
# One orderer, one peer per org (Collection/Laboratory/Manufacturer), one
# CouchDB per peer (state database — lets GetProvenance's composite-key range
# queries run efficiently; also enables rich queries later if needed).
#
# This is a single-orderer, single-peer-per-org PoC network, matching the
# brief's "do not build a huge production network" instruction. A production
# deployment would run 3+ orderers (raft quorum) and 2+ peers per org.

networks:
  ayurtrace:
    name: ayurtrace-network

volumes:
  orderer1.orderer.ayurtrace.com:
  peer0.collection.ayurtrace.com:
  peer0.laboratory.ayurtrace.com:
  peer0.manufacturer.ayurtrace.com:

services:
  orderer1.orderer.ayurtrace.com:
    container_name: orderer1.orderer.ayurtrace.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/orderer.ayurtrace.com/orderers/orderer1.orderer.ayurtrace.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.ayurtrace.com/orderers/orderer1.orderer.ayurtrace.com/tls:/var/hyperledger/orderer/tls
      - orderer1.orderer.ayurtrace.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - ayurtrace

  couchdb0.collection:
    container_name: couchdb0.collection.ayurtrace.com
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 5984:5984
    networks:
      - ayurtrace

  peer0.collection.ayurtrace.com:
    container_name: peer0.collection.ayurtrace.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=ayurtrace-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.collection.ayurtrace.com
      - CORE_PEER_ADDRESS=peer0.collection.ayurtrace.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.collection.ayurtrace.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.collection.ayurtrace.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.collection.ayurtrace.com:7051
      - CORE_PEER_LOCALMSPID=CollectionOrgMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.collection.ayurtrace.com:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/collection.ayurtrace.com/peers/peer0.collection.ayurtrace.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/collection.ayurtrace.com/peers/peer0.collection.ayurtrace.com/tls:/etc/hyperledger/fabric/tls
      - peer0.collection.ayurtrace.com:/var/hyperledger/production
    ports:
      - 7051:7051
    depends_on:
      - couchdb0.collection
    networks:
      - ayurtrace

  couchdb0.laboratory:
    container_name: couchdb0.laboratory.ayurtrace.com
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 6984:5984
    networks:
      - ayurtrace

  peer0.laboratory.ayurtrace.com:
    container_name: peer0.laboratory.ayurtrace.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=ayurtrace-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.laboratory.ayurtrace.com
      - CORE_PEER_ADDRESS=peer0.laboratory.ayurtrace.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.laboratory.ayurtrace.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.laboratory.ayurtrace.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.laboratory.ayurtrace.com:9051
      - CORE_PEER_LOCALMSPID=LaboratoryOrgMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.laboratory.ayurtrace.com:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/laboratory.ayurtrace.com/peers/peer0.laboratory.ayurtrace.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/laboratory.ayurtrace.com/peers/peer0.laboratory.ayurtrace.com/tls:/etc/hyperledger/fabric/tls
      - peer0.laboratory.ayurtrace.com:/var/hyperledger/production
    ports:
      - 9051:9051
    depends_on:
      - couchdb0.laboratory
    networks:
      - ayurtrace

  couchdb0.manufacturer:
    container_name: couchdb0.manufacturer.ayurtrace.com
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 7984:5984
    networks:
      - ayurtrace

  peer0.manufacturer.ayurtrace.com:
    container_name: peer0.manufacturer.ayurtrace.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=ayurtrace-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.manufacturer.ayurtrace.com
      - CORE_PEER_ADDRESS=peer0.manufacturer.ayurtrace.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.manufacturer.ayurtrace.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.manufacturer.ayurtrace.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.manufacturer.ayurtrace.com:11051
      - CORE_PEER_LOCALMSPID=ManufacturerOrgMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.manufacturer.ayurtrace.com:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/manufacturer.ayurtrace.com/peers/peer0.manufacturer.ayurtrace.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/manufacturer.ayurtrace.com/peers/peer0.manufacturer.ayurtrace.com/tls:/etc/hyperledger/fabric/tls
      - peer0.manufacturer.ayurtrace.com:/var/hyperledger/production
    ports:
      - 11051:11051
    depends_on:
      - couchdb0.manufacturer
    networks:
      - ayurtrace
